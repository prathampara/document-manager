services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: document_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jonjones
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5434:5432"]   # host port 5433 so it won't clash with a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_manager"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/document_manager
      DB_USER: postgres
      DB_PASSWORD: jonjones
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  pgdata:
